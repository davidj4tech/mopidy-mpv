[mpv]
enabled = true
# Path to mpv's JSON-IPC socket (mpv started with --input-ipc-server=<this>).
ipc_socket = $XDG_RUNTIME_DIR/mopidy-mpv.sock
# Optional: command Mopidy could use to spawn mpv itself. Left blank in this
# skeleton — we assume mpv is managed externally (systemd/runit), like your
# book channel's mpv.
mpv_command =
